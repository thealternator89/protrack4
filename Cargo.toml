[package]
name = "protrack4"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "ProTrack4"
identifier = "nz.thealternator.protrack4.app"
icon = ["assets/icon.icns", "assets/icon.ico"]

[dependencies]
gpui-kit = "0.7"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs4 = "0.12"
crossbeam-channel = "0.5"
oneshot = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSObjCRuntime"] }

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
proptest = "1"
tempfile = "3"
