[package]
name = "protrack4"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.7"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
